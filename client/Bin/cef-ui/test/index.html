<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Last Chaos CEF</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", sans-serif;
      background: #081019;
      color: #edf6ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 25% 20%, #24597c 0, transparent 38%),
        radial-gradient(circle at 80% 85%, #6b3518 0, transparent 38%),
        linear-gradient(145deg, #07111c, #101923);
    }
    main {
      width: min(720px, calc(100vw - 48px));
      padding: 38px;
      border: 1px solid #73bce055;
      border-radius: 18px;
      background: #101b27e6;
      box-shadow: 0 24px 80px #000a, inset 0 1px #ffffff18;
    }
    .eyebrow {
      margin: 0 0 10px;
      color: #73c9f5;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 14px; font-size: clamp(28px, 5vw, 48px); }
    .lead { margin: 0 0 28px; color: #b9cad9; line-height: 1.6; }
    dl {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 12px 18px;
      margin: 0;
      padding: 18px;
      border-radius: 12px;
      background: #07101999;
    }
    dt { color: #79a9c5; }
    dd { margin: 0; overflow-wrap: anywhere; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      color: #88e6b0;
    }
    .status::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 14px currentColor;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Chromium Embedded Framework</p>
    <h1>CEF está integrado</h1>
    <p class="lead">
      Esta vista vive en el cliente, pero fue abierta por una orden del servidor.
      Es la base reutilizable para migrar gradualmente la interfaz del juego.
    </p>
    <dl>
      <dt>Jugador</dt>
      <dd id="player">—</dd>
      <dt>Parámetros</dt>
      <dd id="parameters">—</dd>
      <dt>Ruta</dt>
      <dd>lcui://test</dd>
    </dl>
    <div class="status">Renderizado por Chromium</div>
  </main>
  <script>
    const query = new URLSearchParams(
      location.search || location.hash.slice(1)
    );
    document.querySelector("#player").textContent = query.get("player") || "(sin nombre)";
    document.querySelector("#parameters").textContent =
      query.get("parameters") || "(sin parámetros)";
  </script>
</body>
</html>
