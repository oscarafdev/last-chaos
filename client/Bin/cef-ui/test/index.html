<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel CEF de Last Chaos</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Georgia, "Times New Roman", serif;
      color: #f4e4bd;
      background: transparent;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      padding: 7px;
      background: #050606;
      user-select: none;
    }
    .panel {
      height: 100%;
      overflow: hidden;
      border: 1px solid #d0a54e;
      border-radius: 7px;
      background:
        radial-gradient(circle at 30% 0, #54412655, transparent 45%),
        linear-gradient(145deg, #24231f, #111311 68%);
      box-shadow:
        inset 0 0 0 2px #16110b,
        inset 0 0 0 3px #7b5a25,
        0 4px 14px #000c;
    }
    .titlebar {
      height: 44px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px 0 17px;
      cursor: move;
      touch-action: none;
      border-bottom: 1px solid #80632e;
      background:
        linear-gradient(90deg, #2d2114, #49351d 48%, #241a10),
        repeating-linear-gradient(90deg, transparent 0 12px, #ffffff05 13px);
      box-shadow: inset 0 -1px #090806, inset 0 1px #b9904544;
    }
    .crest {
      width: 19px;
      height: 19px;
      transform: rotate(45deg);
      border: 1px solid #e2ba61;
      background: radial-gradient(circle, #e1b44e 0 20%, #6b4217 24% 55%, #21150c 58%);
      box-shadow: 0 0 7px #d3973766;
    }
    .title {
      flex: 1;
      color: #f4d68d;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .08em;
      text-shadow: 0 2px 2px #000;
    }
    .close {
      width: 29px;
      height: 29px;
      padding: 0 0 3px;
      border: 1px solid #b28a43;
      border-radius: 4px;
      color: #f8e2ae;
      background: linear-gradient(#633324, #351913);
      font: 700 21px/1 Georgia, serif;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px #130907, 0 1px 2px #000;
    }
    .close:hover { color: #fff5d7; background: linear-gradient(#914b32, #4d2118); }
    .content { padding: 24px 28px 20px; }
    .eyebrow {
      margin: 0 0 7px;
      color: #c99d4c;
      font: 700 11px/1.2 "Segoe UI", sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 10px;
      color: #fff0c7;
      font-size: 27px;
      text-shadow: 0 2px 2px #000;
    }
    .lead {
      margin: 0 0 17px;
      color: #cfc3a7;
      font: 14px/1.45 "Segoe UI", sans-serif;
    }
    dl {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 8px 12px;
      margin: 0;
      padding: 12px 14px;
      border: 1px solid #76592f;
      border-radius: 4px;
      background: #090b09aa;
      font: 13px/1.25 "Segoe UI", sans-serif;
    }
    dt { color: #bd9451; }
    dd { margin: 0; color: #eee0be; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status {
      margin-top: 15px;
      color: #9ccf83;
      font: 12px/1 "Segoe UI", sans-serif;
    }
    .status::before { content: "◆"; margin-right: 7px; color: #c4e89b; }
  </style>
</head>
<body>
  <section class="panel">
    <header class="titlebar" id="drag-handle">
      <span class="crest" aria-hidden="true"></span>
      <span class="title">Panel de Chromium</span>
      <button class="close" id="close" type="button" aria-label="Cerrar">×</button>
    </header>
    <main class="content">
      <p class="eyebrow">Chromium Embedded Framework</p>
      <h1>CEF está integrado</h1>
      <p class="lead">Este panel fue abierto por el servidor y sólo captura la entrada dentro de sus límites.</p>
      <dl>
        <dt>Jugador</dt><dd id="player">—</dd>
        <dt>Parámetros</dt><dd id="parameters">—</dd>
        <dt>Ruta</dt><dd>lcui://test</dd>
      </dl>
      <div class="status">Renderizado dentro del juego</div>
    </main>
  </section>
  <script>
    const query = new URLSearchParams(location.search || location.hash.slice(1));
    document.querySelector("#player").textContent = query.get("player") || "(sin nombre)";
    document.querySelector("#parameters").textContent = query.get("parameters") || "(sin parámetros)";

    const sendAction = action =>
      fetch(`lcui://action/${action}?t=${Date.now()}`).catch(() => {});
    const handle = document.querySelector("#drag-handle");
    let dragging = false;
    let moveQueued = false;

    handle.addEventListener("pointerdown", event => {
      if (event.target.closest("#close")) return;
      dragging = true;
      handle.setPointerCapture(event.pointerId);
      sendAction("drag-start");
      event.preventDefault();
    });
    handle.addEventListener("pointermove", () => {
      if (!dragging || moveQueued) return;
      moveQueued = true;
      requestAnimationFrame(() => {
        moveQueued = false;
        sendAction("drag-move");
      });
    });
    const finishDrag = () => {
      if (!dragging) return;
      dragging = false;
      sendAction("drag-end");
    };
    handle.addEventListener("pointerup", finishDrag);
    handle.addEventListener("pointercancel", finishDrag);
    document.querySelector("#close").addEventListener("click", event => {
      event.stopPropagation();
      sendAction("close");
    });
  </script>
</body>
</html>
